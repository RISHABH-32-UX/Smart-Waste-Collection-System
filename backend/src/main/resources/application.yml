spring:
  application:
    name: smart-waste-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartwaste}
    username: ${DB_USERNAME:smartwaste}
    password: ${DB_PASSWORD:smartwaste}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    # Development-only 32-byte base64 key. Supply JWT_SECRET in every real deployment.
    secret: ${JWT_SECRET:c21hcnR3YXN0ZS1kZXZlbG9wbWVudC1rZXktMzItYnl0ZXM=}
    issuer: ${JWT_ISSUER:smart-waste-api}
  storage:
    local-directory: ${LOCAL_UPLOAD_DIRECTORY:var/uploads}
  seed:
    # Dev/demo convenience: one account per role at first startup. Turn off with SEED_DEMO_ACCOUNTS=false.
    demo-accounts: ${SEED_DEMO_ACCOUNTS:true}

server:
  error:
    include-message: never

